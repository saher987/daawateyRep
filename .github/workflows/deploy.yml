name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - staging
          - prod
        required: true

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no key files

env:
  REGION: us-central1
  ARTIFACT_REPO: daawatey
  # Both environments' Cloud SQL instance and Secret Manager secrets live
  # in daawatey-prod — staging deliberately shares prod's instance (a
  # second database, "daawatey_staging", not a second instance; see
  # BUSINESS_LOGIC.md) rather than paying for a whole separate Cloud SQL
  # instance nobody needs yet. That means a staging deploy (running as
  # secrets.GCP_PROJECT_ID=daawatey-staging) has to reach across into
  # daawatey-prod's Secret Manager for its own DATABASE_URL — hence the
  # full projects/.../secrets/... paths below instead of bare
  # "name:latest" (which only resolves within the deploying project).
  # backend-runtime@daawatey-staging's cross-project secretAccessor grant
  # on database-url-staging (and cloudsql.client on daawatey-prod) were
  # set up by hand in Cloud Shell — see BUSINESS_LOGIC.md.
  SECRETS_PROJECT: daawatey-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      # CLOUDSQL_CONNECTION_NAME only exists once an environment actually has
      # a database to reach (see BUSINESS_LOGIC.md) — both staging and prod
      # have one now, pointed at the same daawatey-prod:us-central1:daawatey-db
      # instance, just different databases on it.
      #
      # DATABASE_URL/PULSEEM_API_KEY/RESEND_API_KEY are deliberately NOT
      # GitHub secrets: they live in Google Secret Manager instead, and
      # --set-secrets passes only the *secret name* (not sensitive) through
      # this workflow and into the deploy command. The value itself is
      # injected straight into the container by Cloud Run at startup — it
      # never appears in the service config, `gcloud run services
      # describe`, or a deploy's audit log, unlike --set-env-vars (which is
      # exactly how a database password briefly showed up in plaintext in
      # an audit log while debugging this, before this change).
      - name: Compute backend deploy flags
        id: backend-flags
        # GOOGLE_CLOUD_PROJECT is NOT automatically present on Cloud Run the
        # way it might be on other GCP compute products — confirmed the hard
        # way: app/auth.py's firebase_admin.initialize_app() reads it to set
        # both the Admin SDK's projectId and storageBucket options, silently
        # fell back to neither being set (verify_id_token() didn't care —
        # its ADC has project context from the attached service account
        # regardless — but firebase_admin.storage.bucket() does, and raised
        # "Storage bucket name not specified" on every real upload attempt).
        run: |
          FLAGS="--allow-unauthenticated --service-account=${{ secrets.RUNTIME_SA_EMAIL }} --set-env-vars=^##^GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}##ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"
          if [ -n "${{ secrets.APP_URL }}" ]; then
            FLAGS="$FLAGS##APP_URL=${{ secrets.APP_URL }}"
          fi
          if [ -n "${{ secrets.ANDROID_LATEST_VERSION_CODE }}" ]; then
            FLAGS="$FLAGS##ANDROID_LATEST_VERSION_CODE=${{ secrets.ANDROID_LATEST_VERSION_CODE }}"
          fi
          if [ -n "${{ secrets.IOS_LATEST_VERSION_CODE }}" ]; then
            FLAGS="$FLAGS##IOS_LATEST_VERSION_CODE=${{ secrets.IOS_LATEST_VERSION_CODE }}"
          fi
          if [ -n "${{ secrets.RESEND_FROM_EMAIL }}" ]; then
            FLAGS="$FLAGS##RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}"
          fi
          # Invitation channel (app/integrations/whatsapp.py) — all optional;
          # unset INVITATION_CHANNEL means sms, exactly as before. Phone
          # lists must be comma-separated with no spaces (same whitespace
          # tokenizing caveat as RESEND_FROM_EMAIL).
          if [ -n "${{ secrets.INVITATION_CHANNEL }}" ]; then
            FLAGS="$FLAGS##INVITATION_CHANNEL=${{ secrets.INVITATION_CHANNEL }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEST_PHONES }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEST_PHONES=${{ secrets.WHATSAPP_TEST_PHONES }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_DEFAULT }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_DEFAULT=${{ secrets.WHATSAPP_TEMPLATE_DEFAULT }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_CUSTOM }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_CUSTOM=${{ secrets.WHATSAPP_TEMPLATE_CUSTOM }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_UNIVERSAL }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_UNIVERSAL=${{ secrets.WHATSAPP_TEMPLATE_UNIVERSAL }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_THANKS }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_THANKS=${{ secrets.WHATSAPP_TEMPLATE_THANKS }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_REMINDER_ACCEPTED }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_REMINDER_ACCEPTED=${{ secrets.WHATSAPP_TEMPLATE_REMINDER_ACCEPTED }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_REMINDER_PENDING }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_REMINDER_PENDING=${{ secrets.WHATSAPP_TEMPLATE_REMINDER_PENDING }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_WEBHOOK_VERIFY_TOKEN=${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}"
          fi
          if [ -n "${{ secrets.WHATSAPP_TEMPLATE_LANG }}" ]; then
            FLAGS="$FLAGS##WHATSAPP_TEMPLATE_LANG=${{ secrets.WHATSAPP_TEMPLATE_LANG }}"
          fi
          # TEST_RECIPIENTS (app/integrations/test_recipients.py): staging
          # only. Limits every SMS/WhatsApp/email to these phones/emails.
          if [ -n "${{ secrets.TEST_RECIPIENTS }}" ]; then
            FLAGS="$FLAGS##TEST_RECIPIENTS=${{ secrets.TEST_RECIPIENTS }}"
          fi
          if [ -n "${{ secrets.CLOUDSQL_CONNECTION_NAME }}" ]; then
            # Every Secret Manager secret lives in daawatey-prod (see the
            # SECRETS_PROJECT comment above); staging's copy of a secret is
            # the same name with "-staging" on the end. prod's are in the
            # project it deploys into, so the short "name:latest" form works.
            # Staging's are cross-project, which needs gcloud's full form:
            # projects/PROJECT_NUMBER/secrets/NAME:VERSION. Two things caught
            # live across the first two staging deploy attempts: it's always
            # :VERSION (colon), never /versions/VERSION ("No secret version
            # specified"), and cross-project resolution wants the numeric
            # project *number* (1046309287701, daawatey-prod's), not the
            # "daawatey-prod" ID, which errors "not a valid secret name".
            secret_ref() {
              if [ "${{ inputs.environment }}" = "prod" ]; then
                echo "$1:latest"
              else
                echo "projects/1046309287701/secrets/$1-staging:latest"
              fi
            }
            # One single --set-secrets flag, not one per secret: gcloud
            # treats a repeated --set-secrets as last-one-wins on the whole
            # deploy, not additive — two separate flags here would silently
            # drop DATABASE_URL. Built up as one comma-separated list.
            SECRETS_FLAG="DATABASE_URL=$(secret_ref database-url)"

            # Pulseem (SMS) / Resend (email): always on prod. On staging
            # only once TEST_RECIPIENTS is set, so staging can never text or
            # email a real guest whose number ended up in its test data.
            # Without them (the old staging setup) sends are logged and
            # skipped, and phone-OTP login can't work there. Create
            # pulseem-api-key-staging / resend-api-key-staging first: a
            # missing Secret Manager secret fails the deploy.
            if [ "${{ inputs.environment }}" = "prod" ] || [ -n "${{ secrets.TEST_RECIPIENTS }}" ]; then
              SECRETS_FLAG="$SECRETS_FLAG,PULSEEM_API_KEY=$(secret_ref pulseem-api-key),RESEND_API_KEY=$(secret_ref resend-api-key)"
            fi

            # WhatsApp's token only gets mounted once WHATSAPP_PHONE_NUMBER_ID
            # is set for this environment, and the webhook's signature key
            # (routers/whatsapp_webhook.py) once WHATSAPP_WEBHOOK_VERIFY_TOKEN
            # is: a Secret Manager secret that doesn't exist yet would fail
            # the whole deploy.
            if [ -n "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" ]; then
              SECRETS_FLAG="$SECRETS_FLAG,WHATSAPP_TOKEN=$(secret_ref whatsapp-token)"
              if [ -n "${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" ]; then
                SECRETS_FLAG="$SECRETS_FLAG,WHATSAPP_APP_SECRET=$(secret_ref whatsapp-app-secret)"
              fi
            fi

            FLAGS="$FLAGS --add-cloudsql-instances=${{ secrets.CLOUDSQL_CONNECTION_NAME }} --set-secrets=$SECRETS_FLAG"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-backend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          # ALLOWED_ORIGINS is comma-separated (multiple allowed origins) and
          # must go through `flags`, not `env_vars`: gcloud's --set-env-vars
          # treats commas as the separator *between* variables, so a value
          # containing commas gets silently truncated at the first one via
          # the structured env_vars input. The `^##^` prefix tells gcloud to
          # use "##" as that separator instead, so commas inside the value
          # stay literal. See: gcloud topic escaping.
          flags: ${{ steps.backend-flags.outputs.flags }}

      - name: Build and push frontend image
        # VITE_ALLOW_EMAIL_AUTH is always true here: email/password is a
        # fully supported sign-in method on web (both staging and prod).
        # The "test builds only" restriction in ARCHITECTURE.md applies once
        # native Capacitor builds exist, where it must be forced false for
        # real App Store/Play builds.
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_VAPID_KEY="${{ secrets.VITE_FIREBASE_VAPID_KEY }}" \
            --build-arg VITE_API_BASE_URL="${{ steps.deploy-backend.outputs.url }}" \
            --build-arg VITE_ALLOW_EMAIL_AUTH="true" \
            --build-arg VITE_BUILD_ID="${{ github.run_number }}-${{ github.sha }}" \
            -t "$IMAGE" \
            frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-frontend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: --allow-unauthenticated

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - staging
          - prod
        required: true

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no key files

env:
  REGION: us-central1
  ARTIFACT_REPO: daawatey

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      # DATABASE_URL/CLOUDSQL_CONNECTION_NAME only exist once an environment
      # actually has a Cloud SQL instance provisioned (see BUSINESS_LOGIC.md)
      # — staging doesn't yet, so this is a deliberate no-op there: an empty
      # secret means the `if` below adds nothing and the backend runs
      # exactly as it did before this branch.
      - name: Compute backend deploy flags
        id: backend-flags
        run: |
          FLAGS="--allow-unauthenticated --service-account=${{ secrets.RUNTIME_SA_EMAIL }} --set-env-vars=^##^ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            FLAGS="$FLAGS##DATABASE_URL=${{ secrets.DATABASE_URL }} --add-cloudsql-instances=${{ secrets.CLOUDSQL_CONNECTION_NAME }}"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-backend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          # ALLOWED_ORIGINS is comma-separated (multiple allowed origins) and
          # must go through `flags`, not `env_vars`: gcloud's --set-env-vars
          # treats commas as the separator *between* variables, so a value
          # containing commas gets silently truncated at the first one via
          # the structured env_vars input. The `^##^` prefix tells gcloud to
          # use "##" as that separator instead, so commas inside the value
          # stay literal. See: gcloud topic escaping.
          flags: ${{ steps.backend-flags.outputs.flags }}

      - name: Build and push frontend image
        # VITE_ALLOW_EMAIL_AUTH is always true here: email/password is a
        # fully supported sign-in method on web (both staging and prod).
        # The "test builds only" restriction in ARCHITECTURE.md applies once
        # native Capacitor builds exist, where it must be forced false for
        # real App Store/Play builds.
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_API_BASE_URL="${{ steps.deploy-backend.outputs.url }}" \
            --build-arg VITE_ALLOW_EMAIL_AUTH="true" \
            --build-arg VITE_BUILD_ID="${{ github.run_number }}-${{ github.sha }}" \
            -t "$IMAGE" \
            frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-frontend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: --allow-unauthenticated

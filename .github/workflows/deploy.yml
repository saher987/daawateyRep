name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - staging
          - prod
        required: true

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no key files

env:
  REGION: us-central1
  ARTIFACT_REPO: daawatey
  # Both environments' Cloud SQL instance and Secret Manager secrets live
  # in daawatey-prod — staging deliberately shares prod's instance (a
  # second database, "daawatey_staging", not a second instance; see
  # BUSINESS_LOGIC.md) rather than paying for a whole separate Cloud SQL
  # instance nobody needs yet. That means a staging deploy (running as
  # secrets.GCP_PROJECT_ID=daawatey-staging) has to reach across into
  # daawatey-prod's Secret Manager for its own DATABASE_URL — hence the
  # full projects/.../secrets/... paths below instead of bare
  # "name:latest" (which only resolves within the deploying project).
  # backend-runtime@daawatey-staging's cross-project secretAccessor grant
  # on database-url-staging (and cloudsql.client on daawatey-prod) were
  # set up by hand in Cloud Shell — see BUSINESS_LOGIC.md.
  SECRETS_PROJECT: daawatey-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      # CLOUDSQL_CONNECTION_NAME only exists once an environment actually has
      # a database to reach (see BUSINESS_LOGIC.md) — both staging and prod
      # have one now, pointed at the same daawatey-prod:us-central1:daawatey-db
      # instance, just different databases on it.
      #
      # DATABASE_URL/PULSEEM_API_KEY/RESEND_API_KEY are deliberately NOT
      # GitHub secrets: they live in Google Secret Manager instead, and
      # --set-secrets passes only the *secret name* (not sensitive) through
      # this workflow and into the deploy command. The value itself is
      # injected straight into the container by Cloud Run at startup — it
      # never appears in the service config, `gcloud run services
      # describe`, or a deploy's audit log, unlike --set-env-vars (which is
      # exactly how a database password briefly showed up in plaintext in
      # an audit log while debugging this, before this change).
      - name: Compute backend deploy flags
        id: backend-flags
        # GOOGLE_CLOUD_PROJECT is NOT automatically present on Cloud Run the
        # way it might be on other GCP compute products — confirmed the hard
        # way: app/auth.py's firebase_admin.initialize_app() reads it to set
        # both the Admin SDK's projectId and storageBucket options, silently
        # fell back to neither being set (verify_id_token() didn't care —
        # its ADC has project context from the attached service account
        # regardless — but firebase_admin.storage.bucket() does, and raised
        # "Storage bucket name not specified" on every real upload attempt).
        run: |
          FLAGS="--allow-unauthenticated --service-account=${{ secrets.RUNTIME_SA_EMAIL }} --set-env-vars=^##^GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}##ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"
          if [ -n "${{ secrets.APP_URL }}" ]; then
            FLAGS="$FLAGS##APP_URL=${{ secrets.APP_URL }}"
          fi
          if [ -n "${{ secrets.RESEND_FROM_EMAIL }}" ]; then
            FLAGS="$FLAGS##RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}"
          fi
          if [ -n "${{ secrets.CLOUDSQL_CONNECTION_NAME }}" ]; then
            # prod's secret lives in the same project it's deploying into,
            # so the short "name:latest" form works. Staging's Cloud Run
            # service runs as daawatey-staging but its DATABASE_URL secret
            # lives in daawatey-prod (see the SECRETS_PROJECT comment
            # above) — a cross-project reference needs gcloud's full
            # resource-path form instead: projects/PROJECT_NUMBER/secrets/
            # NAME:VERSION. Two things caught live across the first two
            # staging deploy attempts: it's always :VERSION (colon), never
            # /versions/VERSION — "No secret version specified" is what you
            # get for the latter, even on a full path — and cross-project
            # resolution specifically wants the numeric project *number*
            # (1046309287701, daawatey-prod's — visible in any IAM policy
            # dump for the project), not the "daawatey-prod" project ID
            # string, which errors "not a valid secret name" despite
            # otherwise-correct syntax.
            if [ "${{ inputs.environment }}" = "prod" ]; then
              DB_SECRET_REF="database-url:latest"
            else
              DB_SECRET_REF="projects/1046309287701/secrets/database-url-staging:latest"
            fi
            # One single --set-secrets flag, not one per secret: gcloud
            # treats a repeated --set-secrets as last-one-wins on the whole
            # deploy, not additive — two separate flags here would have
            # silently dropped DATABASE_URL the moment the prod-only
            # Pulseem/Resend branch below also fired. Built up as one
            # comma-separated list instead.
            SECRETS_FLAG="DATABASE_URL=$DB_SECRET_REF"

            # Pulseem (SMS) / Resend (email) stay real-send only on prod —
            # same-project secrets, short form is fine here too. Staging
            # intentionally has no pulseem-api-key-staging/
            # resend-api-key-staging secrets — app/integrations/pulseem.py
            # and resend_email.py already degrade gracefully (log + skip)
            # when their key isn't set, which is exactly the point here:
            # testing on staging must never text or email a real phone
            # number/inbox. Reusing prod's real keys on staging would do
            # exactly that, silently.
            if [ "${{ inputs.environment }}" = "prod" ]; then
              SECRETS_FLAG="$SECRETS_FLAG,PULSEEM_API_KEY=pulseem-api-key:latest,RESEND_API_KEY=resend-api-key:latest"
            fi

            FLAGS="$FLAGS --add-cloudsql-instances=${{ secrets.CLOUDSQL_CONNECTION_NAME }} --set-secrets=$SECRETS_FLAG"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-backend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          # ALLOWED_ORIGINS is comma-separated (multiple allowed origins) and
          # must go through `flags`, not `env_vars`: gcloud's --set-env-vars
          # treats commas as the separator *between* variables, so a value
          # containing commas gets silently truncated at the first one via
          # the structured env_vars input. The `^##^` prefix tells gcloud to
          # use "##" as that separator instead, so commas inside the value
          # stay literal. See: gcloud topic escaping.
          flags: ${{ steps.backend-flags.outputs.flags }}

      - name: Build and push frontend image
        # VITE_ALLOW_EMAIL_AUTH is always true here: email/password is a
        # fully supported sign-in method on web (both staging and prod).
        # The "test builds only" restriction in ARCHITECTURE.md applies once
        # native Capacitor builds exist, where it must be forced false for
        # real App Store/Play builds.
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}"
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_API_BASE_URL="${{ steps.deploy-backend.outputs.url }}" \
            --build-arg VITE_ALLOW_EMAIL_AUTH="true" \
            --build-arg VITE_BUILD_ID="${{ github.run_number }}-${{ github.sha }}" \
            -t "$IMAGE" \
            frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: daawatey-frontend
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: --allow-unauthenticated

name: Build iOS Release (IPA)

# The signed, App Store-bound counterpart to ios-build.yml's unsigned
# simulator build — mirrors android-release-build.yml's shape and reasoning
# (prod config, real signing assets, non-secret confirmation printouts)
# adapted to iOS's own signing model: instead of one keystore file, Apple
# needs a distribution certificate *and* a provisioning profile that names
# each other (the profile embeds which certificate it trusts), both
# installed into a fresh, job-scoped keychain rather than passed as a
# single file to gradle.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write GoogleService-Info.plist
        # daawatey-prod's iOS app registration — same base64-secret pattern
        # as Android's google-services.json and ios-build.yml's staging
        # copy, just the prod project's file this time.
        #
        # This file must land at this exact path *before* the Archive step:
        # App.xcodeproj/project.pbxproj now lists GoogleService-Info.plist as
        # a Resources build-phase member (by path, not by content), so
        # whatever real file exists here at build time is what gets copied
        # into the .app bundle. Previously this step wrote the file to disk
        # but nothing in the Xcode project referenced it, so it was silently
        # dropped from every IPA — @capacitor-firebase/authentication's
        # plugin `load()` then called `+[FIRApp configure]` against a bundle
        # with no GoogleService-Info.plist, which throws an uncaught
        # NSException immediately at launch (root-caused via dSYM
        # symbolication of TestFlight builds 9/10's identical crash).
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > frontend/ios/App/App/GoogleService-Info.plist

      - name: Show GoogleService-Info.plist identifiers (non-secret)
        # Confirms the secret is actually the prod project's file, not a
        # stale/staging one — same reasoning as android-release-build.yml's
        # certificate printout: prove it from the build log, don't just
        # assume the secret is right.
        run: |
          PLIST=frontend/ios/App/App/GoogleService-Info.plist
          echo "project_id : $(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$PLIST")"
          echo "bundle_id  : $(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST")"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: https://daawatey-backend-t3tobt7bfq-uc.a.run.app
          VITE_BUILD_ID: "${{ github.run_number }}-${{ github.sha }}"
          # Real production build: Google/Apple Sign-In only, same rule as
          # android-release-build.yml.
          VITE_ALLOW_EMAIL_AUTH: "false"
        run: npm run build

      - name: Sync Capacitor iOS project
        working-directory: frontend
        run: npx cap sync ios

      - name: Import signing certificate & provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          # Only needs to survive this one job — a fresh, random-enough
          # value scoped to the run, not a real secret worth its own name.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Two failed guesses in a row from output *position* alone, both
          # wrong (the actual failure point moved and I didn't know it) —
          # tracing every command as it actually runs beats guessing again.
          set -x
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # A missing/empty secret decodes to a 0-byte file, which
          # `security cms`/`security import` then fail on with a cryptic
          # "Cannot parse a NULL or zero-length data" — check explicitly so
          # a bad secret says exactly that instead.
          echo "distribution.p12 size: $(wc -c < "$CERT_PATH") bytes"
          echo "profile.mobileprovision size: $(wc -c < "$PROFILE_PATH") bytes"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 decoded to an empty file — the secret is missing or empty."
            exit 1
          fi
          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 decoded to an empty file — the secret is missing or empty."
            exit 1
          fi

          # A dedicated keychain rather than the runner's real login
          # keychain — lives entirely under $RUNNER_TEMP, which GitHub
          # wipes with the rest of the job's workspace, so nothing signing-
          # related survives past this run.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # xcodebuild finds provisioning profiles here by filename = the
          # profile's own UUID, not anything human-chosen — extract it from
          # the profile itself rather than guessing/hardcoding it.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # Both `security cms -D` and `openssl smime -verify -noverify`
          # have now failed on this exact file with no diagnosable reason
          # visible (empty output, no stderr surfaced) — rather than guess
          # at a third tool/flag combination, try both against real files
          # (not a pipe straight into PlistBuddy, which was swallowing
          # whichever tool's stderr explained the *actual* failure) and
          # print each one's stderr on failure so the next run's log says
          # why, whichever tool turns out to be the problem.
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          set +e
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST" 2>"$RUNNER_TEMP/cms_stderr.txt"
          CMS_STATUS=$?
          set -e
          if [ "$CMS_STATUS" -ne 0 ] || [ ! -s "$PROFILE_PLIST" ]; then
            echo "::warning::security cms -D failed (exit $CMS_STATUS) or produced no output — stderr was:"
            cat "$RUNNER_TEMP/cms_stderr.txt" || true
            echo "::warning::Falling back to openssl smime"
            set +e
            openssl smime -inform der -verify -noverify -in "$PROFILE_PATH" -out "$PROFILE_PLIST" 2>"$RUNNER_TEMP/openssl_stderr.txt"
            OPENSSL_STATUS=$?
            set -e
            if [ "$OPENSSL_STATUS" -ne 0 ] || [ ! -s "$PROFILE_PLIST" ]; then
              echo "::error::openssl smime also failed (exit $OPENSSL_STATUS) or produced no output — stderr was:"
              cat "$RUNNER_TEMP/openssl_stderr.txt" || true
              echo "::error::Could not extract plist content from the provisioning profile via either tool."
              exit 1
            fi
          fi
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Extracted plist but it has no UUID key — dumping it for inspection:"
            cat "$PROFILE_PLIST" || true
            exit 1
          fi
          echo "profile UUID: $PROFILE_UUID"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.daawatey.app</key>
              <!-- Must exactly match the profile *name* chosen on Apple's
                   portal (Certificates, Identifiers & Profiles → Profiles),
                   not its UUID or filename. -->
              <string>Daawatey App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive
        working-directory: frontend/ios/App
        run: |
          # CODE_SIGN_STYLE=Manual etc. as xcodebuild *command-line*
          # overrides apply to every target in the build graph, not just the
          # App target — including all the SPM package dependencies
          # (Firebase, Facebook SDK, GoogleUtilities, GTMSessionFetcher,
          # AppAuth, GoogleSignIn, Promises...), none of which are app
          # bundles and none of which support provisioning profiles at all.
          # Hit this on the first real archive attempt: a wall of "X does
          # not support provisioning profiles" errors, one per dependency.
          #
          # CODE_SIGNING_ALLOWED=NO (previously set here) avoided that by
          # skipping signing at archive time entirely and letting
          # -exportArchive apply the real cert/profile only to the App
          # bundle afterwards. That worked for basic signing, but it also
          # skips Xcode's entitlements-processing phase for the App target
          # — -exportArchive then has nothing to re-sign from and silently
          # drops any custom entitlement (confirmed: com.apple.developer.
          # applesignin never made it into the exported binary despite
          # App.entitlements + CODE_SIGN_ENTITLEMENTS being set correctly,
          # which is why Sign In with Apple kept failing with
          # AuthorizationError 1000 even after the entitlement/profile were
          # otherwise correct).
          #
          # The actual fix: put CODE_SIGN_IDENTITY/CODE_SIGN_STYLE=Manual/
          # PROVISIONING_PROFILE_SPECIFIER in the App target's own
          # XCBuildConfiguration in project.pbxproj instead of passing them
          # as CLI overrides here. Project-file settings are scoped to that
          # one target and never reach the SPM package graph — only the CLI
          # form does — so real signing (and entitlements generation) now
          # happens for App during archive, without resurrecting the SPM
          # errors CODE_SIGNING_ALLOWED=NO was added to avoid.
          #
          # CURRENT_PROJECT_VERSION (CFBundleVersion) is otherwise hardcoded
          # to 1 in the Xcode project — fine for the first-ever upload, but
          # every run after it hits ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE
          # from App Store Connect (confirmed: run 7 uploaded fine at
          # version 1, run 8 failed re-uploading the same 1). Same problem
          # android-release-build.yml already solves with
          # -PandroidVersionCode=${{ github.run_number }} — same fix here.
          # This one is a generic build setting harmlessly inherited by SPM
          # package targets, not one with per-target-type validation that
          # errors on propagation, so it's still fine as a CLI override.
          #
          # DEVELOPMENT_TEAM: CODE_SIGN_STYLE=Manual (set on the App target
          # above) needs a team explicitly, or archive fails immediately —
          # "Signing for 'App' requires a development team ... Select a
          # development team ... that matches the selected profile" (run 15).
          # Same "generic, not per-target-type-validated" category as
          # CURRENT_PROJECT_VERSION above — a bare team identifier doesn't
          # force any target into needing a provisioning profile the way
          # CODE_SIGN_STYLE/CODE_SIGN_IDENTITY/PROVISIONING_PROFILE_SPECIFIER
          # did, so it's fine as a CLI override; kept out of the committed
          # project file since it's sourced from the same secret
          # ExportOptions.plist's teamID already uses above.
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Report which certificate signed the app
        # Same reasoning as android-release-build.yml's apksigner check —
        # confirms the *actual* embedded signing identity from the build
        # output, not just what we asked xcodebuild for. codesign has to
        # inspect the .app bundle itself, not the .ipa around it — an .ipa
        # is just a zip, and running codesign on the zip directly always
        # says "code object is not signed at all" regardless of whether the
        # app inside it is actually signed correctly (confirmed on the
        # first successful export: this misreported despite EXPORT
        # SUCCEEDED and a genuinely valid signed .app inside).
        run: |
          UNZIP_DIR="$RUNNER_TEMP/ipa-check"
          mkdir -p "$UNZIP_DIR"
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$UNZIP_DIR"
          codesign -dvv "$UNZIP_DIR"/Payload/*.app 2>&1 || true
          # Sign In with Apple failed on-device (AuthorizationError 1000) on
          # a build that should have carried the applesignin entitlement —
          # rather than guess again, print exactly what actually got signed
          # into the binary and what the embedded provisioning profile
          # actually grants, so a mismatch (if any) shows up directly in
          # this log instead of being inferred from project settings alone.
          echo "--- entitlements actually embedded in the signed binary ---"
          codesign -d --entitlements - "$UNZIP_DIR"/Payload/*.app 2>&1 || true
          echo "--- entitlements granted by the embedded provisioning profile ---"
          # security cms -D piped straight into PlistBuddy failed here last
          # run ("Cannot parse a NULL or zero-length data") — same
          # pipe-into-PlistBuddy gotcha already worked around in the signing
          # setup step above. Decode to a real file first instead.
          PROFILE_CHECK_PLIST="$RUNNER_TEMP/profile-check.plist"
          security cms -D -i "$UNZIP_DIR"/Payload/*.app/embedded.mobileprovision > "$PROFILE_CHECK_PLIST" 2>&1 || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$PROFILE_CHECK_PLIST" 2>&1 || true

      - name: Zip dSYMs for symbolication
        # Only the .ipa was kept before this — fine until a device crash
        # log needs symbolicating, at which point there's no way to turn
        # raw addresses back into function/file/line without the matching
        # dSYMs (had to reason from unsymbolicated offsets + linked-image
        # names for the first TestFlight crash instead). archivePath's
        # dSYMs directory has one per framework/binary in this exact build.
        run: |
          DSYM_DIR="$RUNNER_TEMP/App.xcarchive/dSYMs"
          if [ -d "$DSYM_DIR" ]; then
            (cd "$DSYM_DIR" && zip -qr "$RUNNER_TEMP/export/dSYMs.zip" .)
          else
            echo "::warning::No dSYMs directory in the archive — nothing to zip."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: daawatey-release-dsyms
          path: ${{ runner.temp }}/export/dSYMs.zip
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: daawatey-release-ipa
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 30

      - name: Upload to App Store Connect
        # The GitHub artifact above always lands regardless of this step —
        # it's a fallback you can hand to Transporter by hand if this ever
        # fails, same reasoning as keeping the sideloadable APK alongside
        # the AAB in android-release-build.yml. altool wants the API key
        # file at one of a few fixed, undocumented-via-flag locations, not
        # a path you can pass directly — this is the standard one.
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS_DIR"
          KEY_PATH="$KEYS_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::ASC_API_KEY_BASE64 decoded to an empty file — the secret is missing or empty."
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

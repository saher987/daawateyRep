name: Build Android Release (AAB)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > frontend/android/app/google-services.json

      # Prints which certificates the config actually carries, so the build log
      # itself proves whether the secret was updated — nothing here is secret
      # (cert fingerprints and client ids are public identifiers). Google
      # validates the installed app's real signature against the certificates
      # registered server-side, so a certificate missing here is a strong hint
      # that it's also missing from Firebase.
      - name: Show google-services.json contents (non-secret identifiers)
        run: |
          python3 - << 'PY'
          import json
          d = json.load(open('frontend/android/app/google-services.json'))
          c = d['client'][0]
          print('project_id :', d['project_info']['project_id'])
          print('package    :', c['client_info']['android_client_info']['package_name'])
          android = [x for x in c['oauth_client'] if x.get('client_type') == 1]
          web = [x for x in c['oauth_client'] if x.get('client_type') == 3]
          print(f'android certificates registered ({len(android)}):')
          for x in android:
              print('  -', x['android_info']['certificate_hash'])
          print('web client (becomes default_web_client_id):',
                web[0]['client_id'] if web else 'MISSING - native sign-in cannot work')
          PY

      - name: Write release keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: https://daawatey-backend-t3tobt7bfq-uc.a.run.app
          # Surfaced in the app's on-screen diagnostics so a build can be
          # identified on-device — distinguishes a fresh install from a stale one.
          VITE_BUILD_ID: "${{ github.run_number }}-${{ github.sha }}"
          # Real production build: the test-only email/password path must be
          # off, per ARCHITECTURE.md. Google Sign-In is the real path here.
          VITE_ALLOW_EMAIL_AUTH: "false"
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      # The AAB goes to Play (which re-signs it with Play's own App Signing
      # key). The APK is signed with our upload key and is directly
      # installable — useful for isolating "is this broken because of Play's
      # signing certificate, or because of the project config?", since
      # sideloading the APK takes Play's re-signing out of the picture.
      - name: Build signed release AAB + APK
        working-directory: frontend/android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PandroidVersionCode=${{ github.run_number }}

      - name: Report which certificate signed the APK
        working-directory: frontend/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # $ANDROID_HOME/build-tools/*/apksigner is provided by setup-android.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "Certificate actually embedded in the sideloadable APK:"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1\|SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: daawatey-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: daawatey-release-apk-sideload
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
